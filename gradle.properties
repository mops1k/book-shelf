# Параметры JVM для Gradle-демона. JDK для сборки: 17 или новее (AGP 8.7 требует 17+).
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configureondemand=false

# Android
android.useAndroidX=true
android.nonTransitiveRClass=true
android.nonFinalResIds=true

# Kotlin
kotlin.code.style=official

# Тесты: Robolectric и Room in-memory требуют предсказуемой локали и таймзоны.
# Локаль фиксируют сами тесты (см. docs/tdd.md §5), здесь только кодировка вывода.

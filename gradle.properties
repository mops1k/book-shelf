# Параметры JVM для Gradle-демона. JDK для сборки: 17 или новее (AGP 8.7 требует 17+).
# Память подобрана под машину: 7.8 ГБ всего, поэтому 4 ГБ демону Gradle + демон Kotlin + тестовые
# JVM не помещались и сборка уходила в своп (тестовый воркер падал). Демону Gradle — 2 ГБ,
# демону Kotlin (в нём же идёт KSP/Room) — 1 ГБ, остальное остаётся тестам.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx1g -XX:MaxMetaspaceSize=512m

org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
# Наводить конфигурацию только на запрошенные задачи: при 22 модулях это заметно дешевле для
# одиночных прогонов (`:core:data:testDebugUnitTest`), которыми идёт повседневная работа.
org.gradle.configureondemand=true

# Android
android.useAndroidX=true
android.nonTransitiveRClass=true
android.nonFinalResIds=true

# Аварийные переключатели AGP 9 (ступень A миграции, план p_5ce06c674d2a).
# Новый DSL и встроенный Kotlin включены в AGP 9 по умолчанию; новый DSL несовместим с плагином
# org.jetbrains.kotlin.android, а встроенный Kotlin требует KGP >= 2.2.10 и меняет применение
# плагинов compose/serialization. Ступень A идёт с выключенными переключателями (минимальная
# правка build-logic), а ступень D переходит на новый DSL и снимает их — в AGP 10 их удалят.
android.newDsl=false
android.builtInKotlin=false

# Kotlin
kotlin.code.style=official

# Тесты: Robolectric и Room in-memory требуют предсказуемой локали и таймзоны.
# Локаль фиксируют сами тесты (см. «TDD» §5), здесь только кодировка вывода.

# Демоны не должны жить часами: два старых демона по ~1.9 ГБ сделали машину (7.8 ГБ) узким местом,
# сборка уходила в своп и «пустяковый» тест шёл минутами. Простой демон умирает через 10 минут.
org.gradle.daemon.idletimeout=600000
# Воркеров ровно 4: больше на этой машине снова приводит к нехватке памяти, меньше — к простою ядер.
org.gradle.workers.max=4

# Конфигурация detekt. Наследует правила по умолчанию (buildUponDefaultConfig = true),
# здесь только то, что проект осознанно меняет.
#
# Включение: build-logic/convention/src/main/kotlin/.../KotlinAndroid.kt (configureDetekt).
# Запуск: ./gradlew detekt
#
# Названия правил и их секции сверены с default-detekt-config.yml версии 1.23.7 —
# при обновлении detekt конфиг нужно перепроверить: неизвестное имя ломает сборку.
build:
  # Ноль замечаний — цель для CI. На 2026-09-28 гейт снова зелёный: реальные дефекты вычищены,
  # а оставшийся структурный долг (крупные функции парсеров и Compose-экранов) описан порогами
  # и закрытыми списками ниже — со сроком «задача фазы 4 плана p_cf3535f45780».
  maxIssues: 0

complexity:
  LongParameterList:
    functionThreshold: 8
    constructorThreshold: 10
    ignoreDefaultParameters: true
    # Строчные модели (BookEntity) читаются лучше длинным конструктором, чем билдером.
    ignoreDataClasses: true
    # Hilt-воркер обязан принять каждый DAO отдельным параметром, а Compose-экран — каждый
    # колбэк. Разбирать их на «параметр-объекты» ради порога — хуже для читаемости.
    excludes:
      # Репозиторий книг держит DAO и порты отдельными параметрами: «параметр-объект» спрятал бы
      # зависимости, а порог здесь ничего не ловит.
      - '**/repository/impl/BookRepositoryImpl.kt'
      - '**/work/ScanSourceWorker.kt'
      - '**/work/MetadataWorker.kt'
      - '**/work/OpdsDownloadWorker.kt'
      - '**/storage/scan/TreeWalker.kt'
      - '**/feature/library/ui/LibraryScreen.kt'
      # Поле ввода дизайн-системы: каждый параметр — отдельное свойство поля (подсказка, суффикс,
      # тип клавиатуры, фокус). «Параметр-объект» спрятал бы контракт компонента.
      - '**/designsystem/component/EinkTextField.kt'
      - '**/feature/library/LibraryRoute.kt'
  # DAO, парсеры форматов и реестры — длинные классы по своей природе.
  TooManyFunctions:
    thresholdInClasses: 30
    thresholdInInterfaces: 25
    thresholdInObjects: 20
    thresholdInFiles: 25
  # Пороги сложности возвращены к ЗНАЧЕНИЯМ ПО УМОЛЧАНИЮ detekt 01.10.2026: `LongMethod` 60
  # (было ослаблено до 120 28.09.2026), `CyclomaticComplexMethod` 15 (было 30),
  # `NestedBlockDepth` 4 (было 6) — причём БЕЗ исключений: `OpdsDownloader.downloadToStaging`
  # разобран на `streamToFile` и `copyStream`, поэтому исключение из конфига убрано.
  # Разукрупнено вынесением цельных кусков больше пятидесяти функций: экраны и категории настроек,
  # компоненты дизайн-системы, навигация, воркеры, репозитории, разбор и запись форматов, обход
  # дерева SAF, минификатор FB2. Каждый вынос проверен тестами модуля и полным гейтом.
  #
  # ВНИМАНИЕ, ГРАБЛИ ЗАМЕРА: правка ТОЛЬКО этого файла не помечает задачи detekt устаревшими —
  # Gradle считает их UP-TO-DATE. Мерить нужно `./gradlew detekt --continue --rerun-tasks
  # --no-configuration-cache` и смотреть на ИТОГ сборки: если YAML сломан, detekt падает на
  # разборе конфига, а grep по строкам с `*.kt:` показывает «ноль замечаний» — так уже
  # случалось 01.10.2026 (сломанный YAML выглядел как идеально чистый код).
  #
  # ОСОЗНАННО ОСТАЮТСЯ ОСЛАБЛЕННЫМИ (с обоснованием, а не «потому что падает»):
  # * `ReturnCount` max 8 и `ThrowsCount` max 6: в воркерах и валидаторах выходы — это guard
  #   clause (`if (нет доступа) return success()`), и приведение к 2 сделало бы код хуже:
  #   проверено 01.10.2026 — при `max: 2` замечания идут на `doWork` воркеров, `genreText`,
  #   `readingStatusBadge`, `startsWith`, `optimize`;
  # * `TooGenericExceptionCaught`: список файлов закрытый и перечисляет ровно границу с чужим
  #   кодом (воркеры, SAF-запись, парсеры, экраны); политика — docs/decisions.md («битый файл —
  #   это состояние книги, а не исключение»);
  # * `LongParameterList` 8/10: Hilt-воркер обязан принять каждый DAO отдельным параметром, а
  #   Compose-экран — каждый колбэк; «параметр-объект» спрятал бы зависимости;
  # * `TooManyFunctions` (класс 30, интерфейс 25, объект 20, файл 25): при выноске помощников
  #   файл упирается в порог, поэтому помощники делаются СВОБОДНЫМИ функциями файла или
  #   переезжают в отдельный файл (`feature/catalogs/ui/CatalogsList.kt`);
  # * `UnusedParameter`/`NotImplementedDeclaration` выключены: заглушки STUB(Sprint N) — по ADR-013;
  # * `MagicNumber`: токены дизайн-системы (48.dp, 600 px, 200 МБ) — данные, а не «магические числа».
  LongMethod:
    threshold: 60
  # Имя правила в detekt 1.23.7 — CyclomaticComplexMethod (`ComplexMethod` устарело и
  # выдаёт предупреждение о переименовании).
  CyclomaticComplexMethod:
    threshold: 15
  NestedBlockDepth:
    threshold: 4
exceptions:
  # Каркас намеренно состоит из заглушек, помеченных STUB(Sprint N) (ADR-013).
  # Правило включается, когда заглушек не останется (Спринт 9), иначе оно шумит на плане работ.
  NotImplementedDeclaration:
    active: false
  # Политика проекта (docs/decisions.md): «битый файл — это состояние книги, а не исключение».
  # Граница разбора и воркеров обязана ловить Throwable и превращать его в ParseResult.Failed /
  # баннер ошибки; там широкий catch — требование, а не небрежность. Список закрытый: он
  # перечисляет ровно пограничные файлы, поэтому в новом коде правило продолжает работать.
  # Перехват широко допустим там, где отказ приходит извне нашего кода: воркеры и SAF-запись
  # (провайдер чужой), парсеры (файл чужой, формат неизвестный), экраны скана, онбординга,
  # фильтров и настроек (человек не должен терять экран из-за сбоя хранилища, а причина
  # показывается сообщением). В остальных местах тип сужен: наблюдатели хранилища ловят
  # `android.database.SQLException`, а не `Throwable` (29.09.2026).
  TooGenericExceptionCaught:
    excludes:
      - '**/work/ScanSourceWorker.kt'
      - '**/work/MetadataWorker.kt'
      - '**/opds/download/OpdsDownloader.kt'
      - '**/storage/saf/SafTreeWriter.kt'
      - '**/parser/impl/Fb2Parser.kt'
      - '**/parser/impl/ComicArchiveParser.kt'
      - '**/parser/impl/CbzParser.kt'
      - '**/parser/impl/DocxParser.kt'
      - '**/parser/impl/OdtParser.kt'
      - '**/parser/impl/RtfParser.kt'
      - '**/parser/impl/MobiParser.kt'
      - '**/parser/impl/EpubParser.kt'
      - '**/parser/impl/PdfParser.kt'
      - '**/parser/impl/TxtParser.kt'
      - '**/FiltersViewModel.kt'
      - '**/OnboardingViewModel.kt'
      - '**/ScanViewModel.kt'
      - '**/SettingsViewModel.kt'

style:
  MaxLineLength:
    maxLineLength: 120
    excludeCommentStatements: true
  MagicNumber:
    # Токены дизайн-системы (48.dp, 600 px, 200 МБ) — это данные, а не «магические числа».
    ignorePropertyDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
  # Параметры заглушек STUB(Sprint N) намеренно не используются до реализации.
  UnusedParameter:
    active: false
  # UnusedPrivateMember здесь больше нет: в detekt 1.23 такого правила не существует, из-за чего
  # блок ничего не выключал, а замечания давало правило UnusedPrivateProperty (11 шт. на 2026-09-28).
  # Мёртвые свойства вычищены, четыре оставшихся заглушки помечены @Suppress в коде — так
  # исключение видно рядом с местом, а не спрятано в конфиге.
  # Сканирующие циклы парсеров (чтение ZIP/XML) сознательно используют несколько break/continue.
  LoopWithTooManyJumpStatements:
    excludes:
      - '**/storage/files/QuickHash.kt'
      - '**/parser/impl/Fb2Parser.kt'
      - '**/parser/impl/EpubParser.kt'
      - '**/parser/impl/PdfParser.kt'
      - '**/parser/impl/TxtParser.kt'
  ThrowsCount:
    # 5 бросков в `SafeZip.open`: проверка сигнатуры архива, лимитов распаковки и размера записи.
    # Дробить валидацию на функции ради порога — значит разнести правила безопасности по файлу.
    max: 6
  # Ранний выход (guard clause) — принятый стиль проекта; правило оставлено активным,
  # чтобы ловить действительно запутанные функции, а не каждую вторую.
  # Секция именно style: в detekt 1.23.7 ReturnCount лежит в style, а не в complexity —
  # в complexity такого свойства нет, и весь detekt падал с «Property is misspelled».
  ReturnCount:
    max: 8

naming:
  FunctionNaming:
    ignoreAnnotated:
      - 'Composable'
  ConstructorParameterNaming:
    # Имя свойства — privateParameterPattern, а не privatePattern: в detekt 1.23.7
    # ключа privatePattern не существует, и detekt падал с «1 invalid config property».
    privateParameterPattern: '[a-z][A-Za-z0-9]*'

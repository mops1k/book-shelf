name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Раз в неделю: проверка, что версии зависимостей ещё существуют и не вышли критичные обновления
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # TDD-гейт: тесты — первая и обязательная ступень, а не «после сборки».
  # Правила, что именно блокирует слияние, — «TDD» §9.
  tests:
    name: Тесты и статический анализ
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Санитарная проверка исходников (без JDK)
        run: node tools/check-sources.mjs

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit-тесты всех модулей
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: detekt (maxIssues = 0)
        # Гейт блокирующий: замечаний нет (maxIssues = 0), красный detekt останавливает слияние
        # и релиз («TDD» §9). Каркаса с заглушками в дереве давно нет.
        run: ./gradlew detekt

      # TODO(Sprint 1): порог покрытия (Kover) — после появления базовой линии тестов.
      #  Ориентиры по модулям: «TDD» §6. Задача вида:
      #  ./gradlew koverXmlReportDebug && node tools/check-coverage.mjs --threshold-from docs/tdd.md
      #  Точное имя задачи зависит от варианта сборки; включать вместе с первыми тестами данных.

      - name: Отчёты тестов и detekt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/tests/**
            **/build/reports/detekt/**
          if-no-files-found: ignore

  # Сборка всех трёх flavor'ов: расхождение в манифестах и разрешениях должно ломать CI,
  # а не релиз («Архитектура» §9).
  flavors:
    name: Сборка flavor'ов
    runs-on: ubuntu-latest
    needs: tests
    strategy:
      fail-fast: false
      matrix:
        flavor: [full, fdroid, play]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: assemble${{ matrix.flavor }}Debug
        run: ./gradlew :app:assemble${{ matrix.flavor }}Debug --stacktrace

      - name: APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.flavor }}
          path: app/build/outputs/apk/${{ matrix.flavor }}/*.apk
          if-no-files-found: error

  lint:
    name: Android Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: lintFullDebug
        run: ./gradlew :app:lintFullDebug --stacktrace

      - name: Отчёт lint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-*.html
          if-no-files-found: ignore

  # Проверка версий: запускается по расписанию и вручную, чтобы не тратить время на каждом PR.
  versions:
    name: Версии зависимостей
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Проверить существование версий и показать свежие
        run: node tools/check-versions.mjs --latest

name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Раз в неделю: проверка, что версии зависимостей ещё существуют и не вышли критичные обновления
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # TDD-гейт: тесты — первая и обязательная ступень, а не «после сборки».
  # Правила, что именно блокирует слияние, — «TDD» §9.
  tests:
    name: Тесты и статический анализ
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Санитарная проверка исходников (без JDK)
        run: node tools/check-sources.mjs

      - uses: gradle/actions/setup-gradle@v6

      - name: Unit-тесты всех модулей
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Компиляция инструментальных тестов
        # Дешёвая страховка для слоя, который иначе проверяется только ночным прогоном
        # с эмулятором: 08.10.2026 тестовый APK перестал компилироваться (карточка книги
        # получила параметр без значения по умолчанию), и этого не заметил никто — эмулятора
        # в CI не было, а ошибка компиляции молча закрывала все 14 инструментальных тестов.
        # Сборка тестового APK ловит такой дефект на каждом PR за минуты, без эмулятора.
        run: ./gradlew :app:assembleFullDebugAndroidTest --stacktrace

      - name: detekt (maxIssues = 0)
        # Гейт блокирующий: замечаний нет (maxIssues = 0), красный detekt останавливает слияние
        # и релиз («TDD» §9). Каркаса с заглушками в дереве давно нет.
        run: ./gradlew detekt

      - name: Покрытие (Kover) и порог по модулям
        # Порог блокирующий, но поставлен 09.10.2026 по ИЗМЕРЕННОЙ базовой линии
        # (config/coverage.json), поэтому краснеет на падении покрытия, а не «на пустом месте».
        # Варианты *Debug: release идёт с isMinifyEnabled, R8 переименовывает классы и покрытие
        # по нему недостоверно. Инструментальные тесты Kover не покрывает вовсе.
        run: |
          ./gradlew koverXmlReportDebug :app:koverXmlReportFullDebug --stacktrace
          node tools/check-coverage.mjs

      - name: Тесты инструментов репозитория
        # Инструменты — тоже код: проверка порога покрытия тестируется на фикстурах XML,
        # а не «на глаз» (ADR-012: тест написан до инструмента).
        # Шаблон НЕ в кавычках: Node 20 (он стоит в CI) сам `*` не разворачивает и падает
        # с «Could not find .../tools/*.test.mjs» — раскрывает шелл, а Node получает список файлов.
        run: node --test tools/*.test.mjs

      - name: Отчёты тестов, detekt и покрытия
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            **/build/reports/tests/**
            **/build/reports/detekt/**
            **/build/reports/kover/*.xml
          if-no-files-found: ignore

  # Сборка всех трёх flavor'ов: расхождение в манифестах и разрешениях должно ломать CI,
  # а не релиз («Архитектура» §9).
  flavors:
    name: Сборка flavor'ов
    runs-on: ubuntu-24.04
    needs: tests
    strategy:
      fail-fast: false
      matrix:
        flavor: [full, fdroid, play]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      - name: assemble${{ matrix.flavor }}Debug
        run: ./gradlew :app:assemble${{ matrix.flavor }}Debug --stacktrace

      - name: APK
        uses: actions/upload-artifact@v7
        with:
          name: apk-${{ matrix.flavor }}
          # Путь с уровнем build type обязателен: сборка кладёт APK в .../apk/<flavor>/debug/,
          # и без `debug` glob ничего не находил — шаг «APK» падал у всех трёх flavor'ов
          # («No files were found», прогон 37061579165, проверено через `gh run view --log-failed`).
          path: app/build/outputs/apk/${{ matrix.flavor }}/debug/*.apk
          if-no-files-found: error

  lint:
    name: Android Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      - name: lintFullDebug
        run: ./gradlew :app:lintFullDebug --stacktrace

      - name: Отчёт lint
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-report
          path: app/build/reports/lint-results-*.html
          if-no-files-found: ignore

  # Инструментальные тесты (androidTest) на эмуляторе: SAF-провайдер, FileProvider, доставка
  # намерения читалке, разметка карточки на живом измерении — юнит-тестами это не проверить
  # («TDD» §4). До 09.10.2026 слой не выполнялся нигде: в CI не было ни эмулятора, ни
  # connected-задач, а тестовый APK перестал компилироваться незаметно.
  #
  # Запуск ночной и ручной (решение Александра, 09.10.2026): подъём системы и прогон занимают
  # минуты, и на каждом PR это тормозило бы слияние. Блокирующий PR-прогон включается снятием
  # условия `if` ниже — тогда эмулятор заработает и на pull_request.
  #
  # Тесты, которым нужен реальный девайс (`@RequiresDevice`), эмуляторный прогон пропускает сам.
  instrumented:
    name: Инструментальные тесты (эмулятор)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    env:
      # Один источник правды для образа эмулятора: эти же значения входят в ключ кэша AVD,
      # поэтому смена любого параметра сама по себе делает кэш недействительным.
      EMULATOR_API: '35'
      EMULATOR_TARGET: google_apis
      EMULATOR_ARCH: x86_64
      EMULATOR_PROFILE: pixel_6
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # Аппаратное ускорение эмулятора требует /dev/kvm: без правила udev пользователь раннера
      # в группу kvm не попадает, и эмулятор поднимается на программном режиме (медленно).
      - name: Разрешить KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: gradle/actions/setup-gradle@v6

      # Место на раннере: первый прогон (37941014984) упал не на тестах, а на запуске эмулятора —
      # «FATAL | Not enough space to create userdata partition. Available: 6846 MB, need 7372 MB».
      # На стандартном Linux-раннере ~14 ГБ, из них половину занимают предустановленные тулчейны,
      # которые этой сборке не нужны. Удаляем их; размер userdata задаём отдельно (`disk-size`).
      - name: Освободить место для эмулятора
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h / | tail -1

      # Кэш AVD-снапшота: загрузка системы занимает минуты на каждом прогоне, а сам образ между
      # прогонами не меняется. Ключ включает все параметры AVD, поэтому смена любого из них сама
      # создаёт новый снапшот вместо подсовывания старого. Экономия измеряется прогонами подряд:
      # первый (промах кэша) тратит время на создание снапшота, последующие берут его из кэша.
      - name: Кэш AVD-снапшота
        id: avd-cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ env.EMULATOR_API }}-${{ env.EMULATOR_TARGET }}-${{ env.EMULATOR_ARCH }}-${{ env.EMULATOR_PROFILE }}

      # На промахе кэша поднимаем эмулятор один раз только ради снапшота: без `-no-snapshot`
      # выход эмулятора сохраняет состояние загрузки, которое и попадёт в кэш.
      - name: Создать AVD и снять снапшот загрузки
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.EMULATOR_API }}
          target: ${{ env.EMULATOR_TARGET }}
          arch: ${{ env.EMULATOR_ARCH }}
          profile: ${{ env.EMULATOR_PROFILE }}
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          emulator-boot-timeout: 900
          disk-size: 2048M
          script: echo "Снапшот загрузки AVD создан для кэша."

      # Вариант fullDebug: заглушки DebugDocumentsProvider/DebugReaderActivity и артефакт
      # ui-test-manifest подключаются только к debug, а flavor `full` несёт QUERY_ALL_PACKAGES —
      # без него поиск читалок на устройстве неполон (`play` это разрешение не заявляет).
      # `-no-snapshot-save`: прогон тестов не перезаписывает снапшот, лежащий в кэше.
      - name: Тесты на эмуляторе
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.EMULATOR_API }}
          target: ${{ env.EMULATOR_TARGET }}
          arch: ${{ env.EMULATOR_ARCH }}
          profile: ${{ env.EMULATOR_PROFILE }}
          force-avd-creation: false
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          # Размер userdata: по умолчанию система просит под него ~7.4 ГБ, а приложению с тестовым
          # APK (179 МБ) двух гигабайт хватает с запасом — иначе эмулятор не стартует на раннере.
          disk-size: 2048M
          script: ./gradlew :app:connectedFullDebugAndroidTest --stacktrace

      - name: Отчёты инструментальных тестов
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: instrumented-reports
          # Путь к androidTest-results обязателен: HTML-отчёт показывает только шаги, а XML
          # с причинами падений лежит рядом с результатами.
          path: |
            app/build/reports/androidTests/**
            app/build/outputs/androidTest-results/**
          if-no-files-found: ignore

  # Проверка версий: запускается по расписанию и вручную, чтобы не тратить время на каждом PR.
  versions:
    name: Версии зависимостей
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Проверить существование версий и показать свежие
        run: node tools/check-versions.mjs --latest
